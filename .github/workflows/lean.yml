name: Lean build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  prebuild-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          toolchain="$(cat lean-toolchain)"
          elan toolchain install "$toolchain"
          elan default "$toolchain"
          lean --version
          lake --version
      - name: Resolve pinned Lake dependencies
        run: |
          lake update
          git diff --exit-code -- lake-manifest.json
      - name: Download Mathlib build cache
        run: lake exe cache get
      - name: Source formalization audit
        run: python3 scripts/check_formalization.py --inventory formalization-inventory.json
      - name: Build root imports 1-40
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t modules < <(sed -n '1,40{s/^import //p}' BachThesisLean.lean)
          lake build "${modules[@]}"
      - name: Pack stage 1 build state
        run: tar -czf stage-build.tar.gz .lake/build
      - name: Upload stage 1 build state
        uses: actions/upload-artifact@v4
        with:
          name: stage-1-build
          path: stage-build.tar.gz
          if-no-files-found: error

