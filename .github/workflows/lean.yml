          set -o pipefail
          lake build 2>&1 | tee lean-build.log
      - name: Upload Lean build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-build-log
          path: lean-build.log
          if-no-files-found: warn
      - name: Pack root build state
        run: tar -czf root-build.tar.gz .lake/build
