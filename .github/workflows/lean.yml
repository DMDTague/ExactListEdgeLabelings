        run: |
          set -euo pipefail
          tar -xzf .ci-cache/base/stage-build.tar.gz
          tar -xzf .ci-cache/check01/stage-build.tar.gz
          tar -xzf .ci-cache/check23/stage-build.tar.gz
          tar -xzf .ci-cache/check45/stage-build.tar.gz
          tar -xzf .ci-cache/check6/stage-build.tar.gz
      - name: Build Heawood case
        run: lake build BachThesisLean.Cubic.HeawoodCase
